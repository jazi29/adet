<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Habits</title>
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div class="app">

<div class="screen" id="s-today">
  <div class="hd"><div><h1 id="ttl"></h1><p id="dt"></p></div>
    <div style="display:flex"><button class="ib" id="tm" aria-label="Focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg></button><button class="ib g" id="add" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
  <div class="week" id="week"></div>
  <div class="sum hide" id="sum"></div>
  <button class="run hide" id="run"></button>
  <div id="list"></div>
</div>

<div class="screen hide" id="s-stats">
  <div class="hd"><div><h1>Stats</h1><p id="stp">last 30 days</p></div></div>
  <div class="seg2" id="seg2"><button data-v="o" class="on">Overview</button><button data-v="w">Week</button><button data-v="m">Month</button><button data-v="y">Year</button></div>
  <div id="ovw">
  <div class="big" id="bp">0<small>%</small></div>
  <p class="lead" id="bl"></p>
  <div class="sec" style="margin-top:6px">Calendar</div>
  <div class="cchips" id="cchips"></div>
  <div class="card2 cm" id="mcal"></div>
  <div class="sec">Activity</div>
  <div id="allcal"></div>
  <div class="sec">By habit</div><div id="rates"></div>
  <div class="sec">Focus</div><div class="st3"><div><b id="k1">0</b><span>min total</span></div><div><b id="k2">0</b><span>sessions</span></div><div><b id="k3">0</b><span>min today</span></div></div>
  <div class="sec">Data</div>
  <div class="card2"><div class="two"><button class="btn o" id="exp">Export backup</button><button class="btn o" id="impb">Import backup</button></div>
    <p class="note">Save your data to a file and load it on another device or after reinstalling.</p><p class="note dev" id="dev"></p></div>
  </div>
  <div id="rep" class="hide"></div>
</div>

<div class="screen hide" id="s-tasks">
  <div class="hd"><div><h1>Tasks</h1><p>a simple to-do list</p></div></div>
  <div class="addr"><input id="tin" placeholder="New task" maxlength="60"><button id="tadd">Add</button></div>
  <div id="tlist"></div>
</div>

<nav class="nav"><div id="nav">
  <button data-t="today" class="on" aria-label="Today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></button>
  <button data-t="tasks" aria-label="Tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></button>
  <button data-t="stats" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V5M18 20v-6"/></svg></button>
</div></nav>
</div>

<div class="fs hide" id="fs">
  <div class="fh"><button class="ib" id="fx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="ftl">Focus</span><span class="fsp"></span></div>
  <div class="c2">
    <div class="dial" id="dial">
      <svg viewBox="0 0 280 280" aria-hidden="true">
        <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56d364"/><stop offset="1" stop-color="#238636"/></linearGradient></defs>
        <circle class="tick" cx="140" cy="140" r="134"/>
        <circle class="trk" cx="140" cy="140" r="116"/>
        <circle class="arc" id="arc" cx="140" cy="140" r="116" stroke="url(#fg)"/>
        <g class="knob" id="knob"><circle cx="140" cy="24" r="8"/></g>
      </svg>
      <div class="dc"><div class="ft" id="ft">25:00</div><div class="fl" id="fl"></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <select id="hsel" aria-label="Habit"></select>
  </div>
  <button class="btn" id="go"></button>
</div>

<input type="file" id="imp" accept=".json,application/json,text/plain" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" tabindex="-1">
<script src="app.js?v=15"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits</title>
<meta name="theme-color" content="#0a0c0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">

<div class="screen" id="s-today">
  <div class="hd"><div><h1 id="ttl"></h1><p id="dt"></p></div>
    <div style="display:flex"><button class="ib" id="tm" aria-label="Focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2.5h6"/></svg></button><button class="ib g" id="add" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
  <div class="week" id="week"></div>
  <button class="run hide" id="run"></button>
  <div id="list"></div>
</div>

<div class="screen hide" id="s-stats">
  <div class="hd"><div><h1>Stats</h1><p>last 30 days</p></div></div>
  <div class="big mono" id="bp">0<small>%</small></div>
  <p class="lead" id="bl"></p>
  <div id="allcal"></div>
  <div class="sec">By habit</div><div id="rates"></div>
  <div class="sec">Focus</div><div class="st3"><div><b id="k1">0</b><span>min total</span></div><div><b id="k2">0</b><span>sessions</span></div><div><b id="k3">0</b><span>min today</span></div></div>
</div>

<div class="screen hide" id="s-tasks">
  <div class="hd"><div><h1>Tasks</h1><p>a simple to-do list</p></div></div>
  <div class="addr"><input id="tin" placeholder="New task" maxlength="60"><button id="tadd">Add</button></div>
  <div id="tlist"></div>
</div>

<nav class="nav"><div id="nav">
  <button data-t="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Today</button>
  <button data-t="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</button>
  <button data-t="stats"><svg viewBox="0 0 24 24"><path d="M6 20V11M12 20V5M18 20v-6"/></svg>Stats</button>
</div></nav>
</div>

<div class="fs hide" id="fs">
  <button class="ib" id="fx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="c2"><div class="fl" id="fl"></div><div class="ft" id="ft">25:00</div><div class="fb"><u id="fu"></u></div>
    <div class="chips" id="chips"></div><select id="hsel"></select></div>
  <button class="btn" id="go">Start</button>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
